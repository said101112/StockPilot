# ==============================================================================
# 🚀 StockPilot — Production Override Configuration
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.prod up -d --build
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL (Prod: Isolated in private network, no exposed host ports)
  # ----------------------------------------------------------------------------
  postgres:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "${POSTGRES_CPU_LIMIT:-1.5}"
          memory: "${POSTGRES_MEM_LIMIT:-1024M}"
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # Backend (Prod: Multi-Stage JRE Alpine, Non-Root User, Resource Quotas)
  # ----------------------------------------------------------------------------
  backend:
    image: ${DOCKER_IMAGE_BACKEND:-stockpilot-backend:latest}
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SEED_ENABLED: ${SEED_ENABLED:-false}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-validate}
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError"
    deploy:
      resources:
        limits:
          cpus: "${BACKEND_CPU_LIMIT:-2.0}"
          memory: "${BACKEND_MEM_LIMIT:-1024M}"
        reservations:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ----------------------------------------------------------------------------
  # Frontend (Prod: Nginx Reverse Proxy + SPA Static Cache, HTTP Port 80)
  # ----------------------------------------------------------------------------
  frontend:
    image: ${DOCKER_IMAGE_FRONTEND:-stockpilot-frontend:latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    ports:
      - "${PROD_HTTP_PORT:-80}:80"
      - "${PROD_HTTPS_PORT:-443}:443"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "${FRONTEND_CPU_LIMIT:-1.0}"
          memory: "${FRONTEND_MEM_LIMIT:-256M}"
        reservations:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
