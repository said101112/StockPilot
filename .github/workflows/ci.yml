# ==============================================================================
# 🧪 StockPilot — CI Pipeline (Continuous Integration & Quality Gates)
# Runs on every Pull Request to main/staging and on every feature branch push.
# ==============================================================================

name: CI - Quality Gates & Tests

on:
  push:
    branches:
      - 'feat/**'
      - 'fix/**'
      - 'refactor/**'
      - 'chore/**'
      - 'staging'
      - 'main'
  pull_request:
    branches:
      - 'main'
      - 'staging'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  # ----------------------------------------------------------------------------
  # ☕ Job 1: Backend Test & Verification (Spring Boot 4 / Java 17)
  # ----------------------------------------------------------------------------
  backend-ci:
    name: Backend — Compile & Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up Eclipse Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: 🛡️ Make Maven wrapper executable
        run: chmod +x backend/mvnw

      - name: 🧪 Run Unit and Integration Tests
        run: |
          cd backend
          ./mvnw clean test -B -Dstyle.color=always

      - name: 📊 Upload Test Results (Surefire Reports)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/target/surefire-reports/
          retention-days: 7

  # ----------------------------------------------------------------------------
  # ⚛️ Job 2: Frontend Typecheck & Production Bundle (React 19 / Vite)
  # ----------------------------------------------------------------------------
  frontend-ci:
    name: Frontend — TypeCheck & Vite Build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install NPM dependencies
        run: |
          cd frontend
          npm ci

      - name: 🏗️ TypeCheck and Build Production Distribution
        run: |
          cd frontend
          npm run build

      - name: 📊 Upload Frontend Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 3

  # ----------------------------------------------------------------------------
  # 🐳 Job 3: Docker & Compose Syntax Validation & Dry-Run Build
  # ----------------------------------------------------------------------------
  docker-validation:
    name: Docker — Compose & Build Validation
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup dummy environment file for Compose validation
        run: cp .env.example .env

      - name: 🔍 Validate Development Compose Configuration
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml config --quiet

      - name: 🔍 Validate Production Compose Configuration
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Dry-run Backend Production Docker Build
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: false
          tags: stockpilot-backend:ci-check
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🏗️ Dry-run Frontend Production Docker Build
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: false
          tags: stockpilot-frontend:ci-check
          cache-from: type=gha
          cache-to: type=gha,mode=max
