# ==============================================================================
# 🚀 StockPilot — CD Pipeline: STAGING Environment
# Triggers on push to 'staging' branch or manual workflow_dispatch.
# Builds, tests, pushes container images to GHCR, and deploys to Staging.
# ==============================================================================

name: CD - Staging Deployment

on:
  push:
    branches:
      - 'staging'
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force redeployment even if no code changes'
        required: false
        type: boolean
        default: false

concurrency:
  group: cd-staging-environment
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  # ----------------------------------------------------------------------------
  # 🐳 Job 1: Build & Push Container Images to GitHub Container Registry (GHCR)
  # ----------------------------------------------------------------------------
  build-and-push-staging:
    name: Build & Push Images (Staging)
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🏷️ Determine Image Tag
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "tag=staging-${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "IMAGE_TAG=staging-${SHORT_SHA}" >> $GITHUB_ENV

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: ☕ Build & Push Backend Container (Staging)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:staging
            ghcr.io/${{ github.repository }}/backend:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: ⚛️ Build & Push Frontend Container (Staging)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:staging
            ghcr.io/${{ github.repository }}/frontend:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ----------------------------------------------------------------------------
  # 🚢 Job 2: Deploy to Staging Environment
  # ----------------------------------------------------------------------------
  deploy-staging:
    name: Deploy to Staging Server
    runs-on: ubuntu-latest
    needs: build-and-push-staging
    environment:
      name: staging
      url: ${{ vars.STAGING_APP_URL || 'http://staging.stockpilot.local' }}

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🚀 Deploy via SSH (when server credentials are provided)
        if: "${{ secrets.STAGING_SSH_HOST != '' && secrets.STAGING_SSH_KEY != '' }}"
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER || 'deploy' }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_SSH_PORT || 22 }}
          script: |
            set -e
            echo "🚀 Deploying StockPilot Staging [${{ needs.build-and-push-staging.outputs.image_tag }}]..."
            
            cd ${{ secrets.STAGING_APP_DIR || '/opt/stockpilot-staging' }}
            
            # Log in to GHCR to pull newly pushed images
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            
            # Pull latest staging images
            docker pull ghcr.io/${{ github.repository }}/backend:staging
            docker pull ghcr.io/${{ github.repository }}/frontend:staging
            
            # Restart containers with production override
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans
            
            # Prune obsolete dangling images
            docker image prune -f
            
            echo "✅ Staging deployment successfully completed!"

      - name: ℹ️ Staging Deployment Summary & Setup Notice
        if: "${{ secrets.STAGING_SSH_HOST == '' || secrets.STAGING_SSH_KEY == '' }}"
        run: |
          echo "::notice title=Staging Images Published::Images ghcr.io/${{ github.repository }}/backend:staging and frontend:staging were successfully pushed to GHCR."
          echo "To enable automated remote deployment to your Staging server, configure these secrets in Settings > Environments > staging:"
          echo "- STAGING_SSH_HOST (Server IP or domain)"
          echo "- STAGING_SSH_USER (SSH username, e.g. ubuntu, deploy)"
          echo "- STAGING_SSH_KEY (Private SSH Key)"
          echo "- STAGING_APP_DIR (Directory on server, e.g. /opt/stockpilot)"

      - name: 🩺 Smoke Test / Healthcheck Staging Endpoint
        if: "${{ vars.STAGING_HEALTH_URL != '' }}"
        run: |
          echo "Pinging ${{ vars.STAGING_HEALTH_URL }}..."
          curl --fail --retry 5 --retry-delay 5 --max-time 15 ${{ vars.STAGING_HEALTH_URL }} || exit 1
          echo "✅ Staging service is healthy!"
