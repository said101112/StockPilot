# ==============================================================================
# 🚀 StockPilot — CD Pipeline: STAGING Environment
# Triggers on push to 'staging' branch or manual workflow_dispatch.
# Strictly uses versioned tags (staging-<sha>) for auditability (NO mutable :latest).
# ==============================================================================

name: CD - Staging Deployment

on:
  workflow_run:
    workflows: ["CI - Quality Gates & Tests"]
    branches:
      - 'staging'
    types:
      - completed
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force redeployment even if no code changes'
        required: false
        type: boolean
        default: false

concurrency:
  group: cd-staging-environment
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  # ----------------------------------------------------------------------------
  # 🐳 Job 1: Build & Push Versioned Container Images (Docker Hub & GHCR)
  # ----------------------------------------------------------------------------
  build-and-push-staging:
    name: Build & Push Images (Staging Version Tags)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: 🏷️ Determine Explicit Version Tag
        id: meta
        run: |
          TARGET_SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          SHORT_SHA=$(echo "${TARGET_SHA}" | cut -c1-7)
          TAG_NAME="staging-${SHORT_SHA}"
          echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "IMAGE_TAG=${TAG_NAME}" >> $GITHUB_ENV
          echo "SHORT_SHA=${SHORT_SHA}" >> $GITHUB_ENV

          # Build versioned tag lists without :latest
          BACKEND_TAGS="ghcr.io/${{ github.repository }}/backend:${TAG_NAME}"
          FRONTEND_TAGS="ghcr.io/${{ github.repository }}/frontend:${TAG_NAME}"

          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
            DH_USER="${{ secrets.DOCKERHUB_USERNAME }}"
            BACKEND_TAGS="${BACKEND_TAGS},${DH_USER}/stockpilot-backend:${TAG_NAME}"
            FRONTEND_TAGS="${FRONTEND_TAGS},${DH_USER}/stockpilot-frontend:${TAG_NAME}"
          fi

          echo "backend_tags=${BACKEND_TAGS}" >> $GITHUB_OUTPUT
          echo "frontend_tags=${FRONTEND_TAGS}" >> $GITHUB_OUTPUT

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐳 Log in to Docker Hub (if credentials provided)
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: ☕ Build & Push Backend Container (Staging)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.backend_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: ⚛️ Build & Push Frontend Container (Staging)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.frontend_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ----------------------------------------------------------------------------
  # 🚢 Job 2: Deploy to Staging Environment (Exact Tagged Version)
  # ----------------------------------------------------------------------------
  deploy-staging:
    name: Deploy to Staging Server (Tagged Version)
    runs-on: ubuntu-latest
    needs: build-and-push-staging
    environment:
      name: staging
      url: ${{ vars.STAGING_APP_URL || 'http://staging.stockpilot.local' }}
    env:
      STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
      STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: 🚀 Deploy via SSH (when server credentials are provided)
        if: env.STAGING_SSH_HOST != '' && env.STAGING_SSH_KEY != ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER || 'ubuntu' }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_SSH_PORT || 22 }}
          script: |
            set -e
            TARGET_TAG="${{ needs.build-and-push-staging.outputs.image_tag }}"
            echo "🚀 Deploying StockPilot Staging Version: [${TARGET_TAG}]..."
            
            cd ${{ secrets.STAGING_APP_DIR || '/opt/stockpilot-staging' }}
            
            # Determine registry source and pull exact versioned tag
            if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
              echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
              export DOCKER_IMAGE_BACKEND="${{ secrets.DOCKERHUB_USERNAME }}/stockpilot-backend:${TARGET_TAG}"
              export DOCKER_IMAGE_FRONTEND="${{ secrets.DOCKERHUB_USERNAME }}/stockpilot-frontend:${TARGET_TAG}"
            else
              echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
              export DOCKER_IMAGE_BACKEND="ghcr.io/${{ github.repository }}/backend:${TARGET_TAG}"
              export DOCKER_IMAGE_FRONTEND="ghcr.io/${{ github.repository }}/frontend:${TARGET_TAG}"
            fi

            echo "📦 Pulling staging backend image: ${DOCKER_IMAGE_BACKEND}..."
            docker pull "${DOCKER_IMAGE_BACKEND}"
            echo "📦 Pulling staging frontend image: ${DOCKER_IMAGE_FRONTEND}..."
            docker pull "${DOCKER_IMAGE_FRONTEND}"
            
            # Restart containers with exact version tags
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans
            
            # Prune obsolete dangling images
            docker image prune -f
            
            echo "✅ Staging deployment of version [${TARGET_TAG}] completed!"

      - name: ℹ️ Staging Deployment Summary & Setup Notice
        if: env.STAGING_SSH_HOST == '' || env.STAGING_SSH_KEY == ''
        run: |
          echo "::notice title=Staging Images Published::Images for tag [${{ needs.build-and-push-staging.outputs.image_tag }}] were pushed."
          echo "To enable automated remote deployment to your Staging server, configure these secrets in Settings > Environments > staging:"
          echo "- STAGING_SSH_HOST (Server IP or domain)"
          echo "- STAGING_SSH_USER (SSH username, e.g. ubuntu, deploy)"
          echo "- STAGING_SSH_KEY (Private SSH Key)"
          echo "- STAGING_APP_DIR (Directory on server, e.g. /opt/stockpilot)"

      - name: 🩺 Smoke Test / Healthcheck Staging Endpoint
        if: "${{ vars.STAGING_HEALTH_URL != '' }}"
        run: |
          echo "Pinging ${{ vars.STAGING_HEALTH_URL }}..."
          curl --fail --retry 5 --retry-delay 5 --max-time 15 ${{ vars.STAGING_HEALTH_URL }} || exit 1
          echo "✅ Staging service is healthy!"
