# ==============================================================================
# 🏆 StockPilot — CD Pipeline: PRODUCTION Environment
# Triggers on push to 'main' branch, version tags (v*.*.*), or manual dispatch.
# Strictly uses immutable VERSION TAGS (no :latest) for auditability & rollbacks.
# ==============================================================================

name: CD - Production Deployment

on:
  push:
    branches:
      - 'main'
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version tag (e.g. v1.2.0 or 1.2.0)'
        required: true
        default: 'v1.0.0'
        type: string

concurrency:
  group: cd-production-environment
  # Never cancel an in-progress production deployment!
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  # ----------------------------------------------------------------------------
  # 🐳 Job 1: Build & Push Hardened Version-Tagged Images (Docker Hub & GHCR)
  # ----------------------------------------------------------------------------
  build-and-push-production:
    name: Build & Push Images (Production Version Tags)
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🏷️ Calculate Immutable Release Version Tags
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          
          # Priority 1: Manual dispatch input
          if [ -n "${{ github.event.inputs.release_version }}" ]; then
            VERSION="${{ github.event.inputs.release_version }}"
          # Priority 2: Git tag (e.g. refs/tags/v1.0.0 -> v1.0.0)
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          # Priority 3: Main branch commit SHA tag (e.g. prod-a1b2c3d)
          else
            VERSION="prod-${SHORT_SHA}"
          fi

          echo "tag=${VERSION}" >> $GITHUB_OUTPUT
          echo "IMAGE_TAG=${VERSION}" >> $GITHUB_ENV
          echo "SHORT_SHA=${SHORT_SHA}" >> $GITHUB_ENV

          # Build tag lists using strictly explicit version tags (NO :latest)
          BACKEND_TAGS="ghcr.io/${{ github.repository }}/backend:${VERSION},ghcr.io/${{ github.repository }}/backend:sha-${SHORT_SHA}"
          FRONTEND_TAGS="ghcr.io/${{ github.repository }}/frontend:${VERSION},ghcr.io/${{ github.repository }}/frontend:sha-${SHORT_SHA}"

          # If version is prefixed with 'v' (e.g. v1.2.3), also add semantic version without 'v' (1.2.3)
          if [[ "${VERSION}" =~ ^v[0-9]+\.[0-9]+ ]]; then
            CLEAN_VERSION="${VERSION#v}"
            BACKEND_TAGS="${BACKEND_TAGS},ghcr.io/${{ github.repository }}/backend:${CLEAN_VERSION}"
            FRONTEND_TAGS="${FRONTEND_TAGS},ghcr.io/${{ github.repository }}/frontend:${CLEAN_VERSION}"
          fi

          # Add Docker Hub tags if credentials are configured
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
            DH_USER="${{ secrets.DOCKERHUB_USERNAME }}"
            BACKEND_TAGS="${BACKEND_TAGS},${DH_USER}/stockpilot-backend:${VERSION},${DH_USER}/stockpilot-backend:sha-${SHORT_SHA}"
            FRONTEND_TAGS="${FRONTEND_TAGS},${DH_USER}/stockpilot-frontend:${VERSION},${DH_USER}/stockpilot-frontend:sha-${SHORT_SHA}"
            if [[ "${VERSION}" =~ ^v[0-9]+\.[0-9]+ ]]; then
              BACKEND_TAGS="${BACKEND_TAGS},${DH_USER}/stockpilot-backend:${CLEAN_VERSION}"
              FRONTEND_TAGS="${FRONTEND_TAGS},${DH_USER}/stockpilot-frontend:${CLEAN_VERSION}"
            fi
          fi

          echo "backend_tags=${BACKEND_TAGS}" >> $GITHUB_OUTPUT
          echo "frontend_tags=${FRONTEND_TAGS}" >> $GITHUB_OUTPUT

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐳 Log in to Docker Hub (if credentials provided)
        if: "${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}"
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: ☕ Build & Push Backend Container (Production)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.backend_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: ⚛️ Build & Push Frontend Container (Production)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.frontend_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ----------------------------------------------------------------------------
  # 🚢 Job 2: Zero-Downtime Rollout to Production Server
  # ----------------------------------------------------------------------------
  deploy-production:
    name: Deploy to Production Server (Tagged Version)
    runs-on: ubuntu-latest
    needs: build-and-push-production
    environment:
      name: production
      url: ${{ vars.PROD_APP_URL || 'https://stockpilot.app' }}

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🚀 Remote Deploy via SSH
        if: "${{ secrets.PROD_SSH_HOST != '' && secrets.PROD_SSH_KEY != '' }}"
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER || 'deploy' }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_SSH_PORT || 22 }}
          script: |
            set -e
            TARGET_TAG="${{ needs.build-and-push-production.outputs.image_tag }}"
            echo "🚀 Deploying StockPilot Production Version: [${TARGET_TAG}]..."
            
            cd ${{ secrets.PROD_APP_DIR || '/opt/stockpilot' }}
            
            # Determine registry source and pull exact versioned tag
            if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
              echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
              export DOCKER_IMAGE_BACKEND="${{ secrets.DOCKERHUB_USERNAME }}/stockpilot-backend:${TARGET_TAG}"
              export DOCKER_IMAGE_FRONTEND="${{ secrets.DOCKERHUB_USERNAME }}/stockpilot-frontend:${TARGET_TAG}"
            else
              echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
              export DOCKER_IMAGE_BACKEND="ghcr.io/${{ github.repository }}/backend:${TARGET_TAG}"
              export DOCKER_IMAGE_FRONTEND="ghcr.io/${{ github.repository }}/frontend:${TARGET_TAG}"
            fi

            echo "📦 Pulling backend image: ${DOCKER_IMAGE_BACKEND}..."
            docker pull "${DOCKER_IMAGE_BACKEND}"
            echo "📦 Pulling frontend image: ${DOCKER_IMAGE_FRONTEND}..."
            docker pull "${DOCKER_IMAGE_FRONTEND}"
            
            # Rolling update with exact version tags
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans
            
            # Clean up old unused images
            docker image prune -f
            
            echo "✅ Production deployment of version [${TARGET_TAG}] successful!"

      - name: ℹ️ Production Deployment Notice
        if: "${{ secrets.PROD_SSH_HOST == '' || secrets.PROD_SSH_KEY == '' }}"
        run: |
          echo "::notice title=Production Images Published::Production versioned images for tag [${{ needs.build-and-push-production.outputs.image_tag }}] are ready."
          echo "To automate server rollout, configure these secrets in Settings > Environments > production:"
          echo "- PROD_SSH_HOST (Server IP/Domain)"
          echo "- PROD_SSH_USER (SSH User)"
          echo "- PROD_SSH_KEY (Private SSH Key)"
          echo "- PROD_APP_DIR (Server working directory, e.g. /opt/stockpilot)"

      - name: 🩺 Smoke Test / Production Endpoint Healthcheck
        if: "${{ vars.PROD_HEALTH_URL != '' }}"
        run: |
          echo "Pinging production healthcheck at ${{ vars.PROD_HEALTH_URL }}..."
          curl --fail --retry 6 --retry-delay 10 --max-time 20 ${{ vars.PROD_HEALTH_URL }} || exit 1
          echo "✅ Production application is responding and healthy!"
