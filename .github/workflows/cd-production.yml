# ==============================================================================
# 🏆 StockPilot — CD Pipeline: PRODUCTION Environment
# Triggers on push to 'main' branch, version tags (v*.*.*), or manual dispatch.
# Utilizes GitHub Environment protection rules (manual gates, approvals).
# ==============================================================================

name: CD - Production Deployment

on:
  push:
    branches:
      - 'main'
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version override (e.g. v1.2.0)'
        required: false
        type: string

concurrency:
  group: cd-production-environment
  # Never cancel an in-progress production deployment!
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  # ----------------------------------------------------------------------------
  # 🐳 Job 1: Build & Push Hardened Images to GitHub Container Registry (GHCR)
  # ----------------------------------------------------------------------------
  build-and-push-production:
    name: Build & Push Images (Production)
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🏷️ Calculate Release Tags
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          if [ -n "${{ github.event.inputs.release_version }}" ]; then
            VERSION="${{ github.event.inputs.release_version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="prod-${SHORT_SHA}"
          fi
          echo "tag=${VERSION}" >> $GITHUB_OUTPUT
          echo "IMAGE_TAG=${VERSION}" >> $GITHUB_ENV
          echo "SHORT_SHA=${SHORT_SHA}" >> $GITHUB_ENV

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: ☕ Build & Push Backend Container (Production)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:latest
            ghcr.io/${{ github.repository }}/backend:${{ env.IMAGE_TAG }}
            ghcr.io/${{ github.repository }}/backend:sha-${{ env.SHORT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: ⚛️ Build & Push Frontend Container (Production)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:latest
            ghcr.io/${{ github.repository }}/frontend:${{ env.IMAGE_TAG }}
            ghcr.io/${{ github.repository }}/frontend:sha-${{ env.SHORT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ----------------------------------------------------------------------------
  # 🚢 Job 2: Zero-Downtime Rollout to Production Server
  # ----------------------------------------------------------------------------
  deploy-production:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    needs: build-and-push-production
    environment:
      name: production
      url: ${{ vars.PROD_APP_URL || 'https://stockpilot.app' }}

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🚀 Remote Deploy via SSH
        if: "${{ secrets.PROD_SSH_HOST != '' && secrets.PROD_SSH_KEY != '' }}"
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER || 'deploy' }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_SSH_PORT || 22 }}
          script: |
            set -e
            echo "🚀 Deploying StockPilot Production [${{ needs.build-and-push-production.outputs.image_tag }}]..."
            
            cd ${{ secrets.PROD_APP_DIR || '/opt/stockpilot' }}
            
            # Authenticate to GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            
            # Pull verified production images
            docker pull ghcr.io/${{ github.repository }}/backend:latest
            docker pull ghcr.io/${{ github.repository }}/frontend:latest
            
            # Rolling update with production configuration
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans
            
            # Clean up old images
            docker image prune -f
            
            echo "✅ Production deployment successful!"

      - name: ℹ️ Production Deployment Notice
        if: "${{ secrets.PROD_SSH_HOST == '' || secrets.PROD_SSH_KEY == '' }}"
        run: |
          echo "::notice title=Production Images Published::Production images ghcr.io/${{ github.repository }}/backend:latest and frontend:latest are ready."
          echo "To automate server rollout, configure these secrets in Settings > Environments > production:"
          echo "- PROD_SSH_HOST (Server IP/Domain)"
          echo "- PROD_SSH_USER (SSH User)"
          echo "- PROD_SSH_KEY (Private SSH Key)"
          echo "- PROD_APP_DIR (Server working directory, e.g. /opt/stockpilot)"

      - name: 🩺 Smoke Test / Production Endpoint Healthcheck
        if: "${{ vars.PROD_HEALTH_URL != '' }}"
        run: |
          echo "Pinging production healthcheck at ${{ vars.PROD_HEALTH_URL }}..."
          curl --fail --retry 6 --retry-delay 10 --max-time 20 ${{ vars.PROD_HEALTH_URL }} || exit 1
          echo "✅ Production application is responding and healthy!"
