# ==============================================================================
# 📦 StockPilot — Base Docker Compose Configuration
# Common service definitions, networks, volumes, and shared environment schema.
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 🗄️ PostgreSQL Database Service
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: stockpilot-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stockpilot_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_pwd}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-stockpilot_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - stockpilot-network

  # ----------------------------------------------------------------------------
  # ☕ Spring Boot Backend Service
  # ----------------------------------------------------------------------------
  backend:
    container_name: stockpilot-backend
    environment:
      # Database Connection
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-stockpilot_db}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_pwd}
      
      # Spring / JPA
      PORT: ${BACKEND_CONTAINER_PORT:-8999}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      
      # JWT Authentication
      JWT_SECRET: ${JWT_SECRET:-dev-change-me-in-prod-min-32-chars-1234567890abcdef1234567890abcdef}
      JWT_ISSUER: ${JWT_ISSUER:-stockpilot}
      JWT_ACCESS_TTL_MINUTES: ${JWT_ACCESS_TTL_MINUTES:-60}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-7}
      
      # Security & CORS
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost}
      SEED_ENABLED: ${SEED_ENABLED:-true}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - stockpilot-network

  # ----------------------------------------------------------------------------
  # ⚛️ React Vite Frontend Service
  # ----------------------------------------------------------------------------
  frontend:
    container_name: stockpilot-frontend
    depends_on:
      - backend
    networks:
      - stockpilot-network

# ------------------------------------------------------------------------------
# 🌐 Shared Network & Persistent Storage
# ------------------------------------------------------------------------------
networks:
  stockpilot-network:
    name: stockpilot-network
    driver: bridge

volumes:
  postgres_data:
    name: stockpilot_postgres_data
