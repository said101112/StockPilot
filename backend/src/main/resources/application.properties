spring.application.name=StockPilot
server.port=8999

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/stockpilot_db
spring.datasource.username=postgres
spring.datasource.password=said1234
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JWT
app.jwt.secret=dev-change-me-in-prod-min-32-chars-1234567890abcdef1234567890abcdef
app.jwt.issuer=stockpilot
app.jwt.access-ttl-minutes=60
app.jwt.refresh-ttl-days=7

# CORS
app.cors.allowed-origins=http://localhost:5173

# Seeding (dev only)
app.seed.enabled=true
