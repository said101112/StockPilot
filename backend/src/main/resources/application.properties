spring.application.name=StockPilot
server.port=${PORT:8999}

# Database (Externalized through environment variables)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/stockpilot_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:said1234}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JWT (Externalized secret and token TTL)
app.jwt.secret=${JWT_SECRET:dev-change-me-in-prod-min-32-chars-1234567890abcdef1234567890abcdef}
app.jwt.issuer=${JWT_ISSUER:stockpilot}
app.jwt.access-ttl-minutes=${JWT_ACCESS_TTL_MINUTES:60}
app.jwt.refresh-ttl-days=${JWT_REFRESH_TTL_DAYS:7}

# CORS (Configurable per environment, e.g. frontend domain)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Seeding (dev only)
app.seed.enabled=${SEED_ENABLED:true}
