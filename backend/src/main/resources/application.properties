spring.application.name=StockPilot

# PostgreSQL Database Connection
spring.datasource.url=jdbc:postgresql://localhost:5432/stockpilot_db
spring.datasource.username=postgres
spring.datasource.password=said1234
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
# update: automatically creates or updates tables in PostgreSQL without dropping data
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
server.port=8999